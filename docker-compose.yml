version: '3.9'

services:
  tiled:
    build:
      context: .
    container_name: tiled
    ports:
      - "5800:5800"
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - ./:/data
    environment:
      DISPLAY_WIDTH: 2300
      DISPLAY_HEIGHT: 1200
      APP_NAME: Tiled
      USER_ID: 229366
      GROUP_ID: 229366
